# STATUS: WORKS — Llama Scout via Beacon /v1 (OpenAI compat)
# Non-Anthropic model on the same /v1 endpoint that breaks with Anthropic.
# No stream truncation. This confirms the /v1 SSE issue is specific to
# Anthropic model responses being translated through Beacon's compat layer.
# Review quality is poor (hallucinated findings) since no tools and small model.
models:
  llama-scout:
    provider: openai
    model: workers-ai/@cf/meta/llama-4-scout-17b-16e-instruct
    base_url: https://staging-beacon.docker-6aa.workers.dev/v1
    token_key: BEACON_API_KEY

agents:
  root:
    model: llama-scout
    description: Code review orchestrator using Llama Scout via Beacon
    instruction: You are a helpful assistant.
  organizer:
    model: llama-scout
    instruction: |
      You are a review organizer. Given a description of code changes,
      produce a focused brief for each reviewer with exactly four labeled sections,
      each containing what files to look at and what to focus on:

      ## CODE_REVIEW
      ## TEST_REVIEW
      ## SECURITY_REVIEW
      ## DOC_REVIEW
  code_reviewer:
    model: llama-scout
    instruction: |
      You are a code reviewer. Review the provided code for:
      - Code quality, readability, and maintainability
      - Design patterns and architectural consistency
      - Error handling correctness
      - Potential bugs or logic errors
      Be specific. Reference file names and line numbers.
      Output findings as a markdown list with severity (high/medium/low).
  test_reviewer:
    model: llama-scout
    instruction: |
      You are a test reviewer. Review the provided code for:
      - Test coverage of new/changed code
      - Missing edge case tests
      - Test correctness and assertions
      - Whether tests actually validate the behavior they claim to
      Output findings as a markdown list with severity (high/medium/low).
  security_reviewer:
    model: llama-scout
    instruction: |
      You are a security reviewer. Review the provided code for:
      - Input validation and sanitization
      - Authentication and authorization issues
      - Injection vulnerabilities (command, SQL, etc.)
      - Sensitive data exposure
      - Dependency security concerns
      Output findings as a markdown list with severity (critical/high/medium/low).
  doc_reviewer:
    model: llama-scout
    instruction: |
      You are a documentation reviewer. Review the provided code for:
      - Missing or outdated comments and docstrings
      - Public API documentation completeness
      - README or changelog updates needed
      - Consistency between code behavior and documentation
      Output findings as a markdown list with severity (high/medium/low).
  reporter:
    model: llama-scout
    instruction: |
      You are a review reporter. Given findings from code, test, security,
      and documentation reviewers, produce a consolidated review report.

      Structure your report as:
      ## Summary
      One paragraph overall assessment.

      ## Critical/High Findings
      Deduplicated, actionable items that must be addressed.

      ## Medium/Low Findings
      Items worth considering but not blocking.

      ## Verdict
      APPROVE, REQUEST_CHANGES, or NEEDS_DISCUSSION with a one-line rationale.
